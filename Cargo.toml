[workspace]
resolver = "2"
members = [
    "crates/vellmark-core",
    "crates/vellmark-parser",
    "crates/vellmark-theme",
    "crates/vellmark-render",
    "crates/vellmark-export",
    "crates/vellmark-app",
    "crates/vellmark-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/puffinjiang/vellmark"
rust-version = "1.90"

[workspace.dependencies]
ropey = "1.6.1"
crc32fast = "1.4.2"
pulldown-cmark = "0.12"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
cosmic-text = "0.19"
winit = "0.30"
wgpu = "30.0"
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }

vellmark-core = { path = "crates/vellmark-core" }
vellmark-parser = { path = "crates/vellmark-parser" }
vellmark-theme = { path = "crates/vellmark-theme" }
vellmark-render = { path = "crates/vellmark-render" }
vellmark-export = { path = "crates/vellmark-export" }
